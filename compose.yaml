services:
  nvr:
    # A released version, on purpose (#540): restarting the stack never changes the version it runs. To upgrade, follow Settings,
    # Updates (docs/guided-updates.md) and change this line. The "edge" tag is the build of the latest merge to main: for a test
    # machine only, never a production server.
    image: ghcr.io/gvsccrc-it/nvr:0.1.0
    # Camera discovery, ONVIF event delivery, and stream access use the host's
    # camera-network interfaces directly. This is the tested deployment mode.
    network_mode: host
    restart: unless-stopped
    # Bounded on purpose (#543): Docker's default keeps every line for ever, on the system disk. 100 MB at most; raise max-size or
    # max-file here if you need more history. docs: README, "Container logs".
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    stop_grace_period: 30s
    # How many files, pipes and connections the NVR may have open at once (#546). Docker's own default is often 1,024, which a large
    # site's recorder and a busy web interface can both reach. Each worker also raises its own limit as far as this allows.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Hardening (#384). The NVR runs as an unprivileged user and needs no Linux capabilities: all are dropped, and nothing in the
    # container can gain privileges. An init process reaps anything orphaned when a worker is killed, so no zombies are left.
    # (Disk health is the one exception: the commented cap_add below adds back only what smartctl needs.)
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # A memory limit keeps a runaway process inside the container instead of letting the host choose what to kill. Allow about
    # 1 GiB, plus 150 MiB per camera, plus 1 GiB per export running at once (one by default); more with AI on many cameras.
    # Check the use under load with "docker stats" before setting it tightly. See README "Deployment".
    # mem_limit: 4g
    environment:
      NVR_LISTEN_PORT: ${NVR_PORT:-8280}
      NVR_DB_PATH: /data/nvr.sqlite3
      NVR_RECORDINGS_PATH: /recordings
      NVR_STORAGE_VOLUMES: '{"default":"","archive":"archive"}'
      NVR_CREDENTIAL_KEY_PATH: /secrets/credentials.key
      NVR_SESSION_HOURS: ${NVR_SESSION_HOURS:-12}
      NVR_COOKIE_SECURE: ${NVR_COOKIE_SECURE:-false}
      NVR_PUBLIC_URL: ${NVR_PUBLIC_URL:-}
      # Remote access (docs/remote-access.md). Forwarded headers (client address, HTTPS, host) are believed only from these proxies: addresses or networks, comma-separated.
      NVR_TRUSTED_PROXIES: ${NVR_TRUSTED_PROXIES:-}
      # Networks that count as "local" besides loopback, private, link-local and Tailscale addresses, and extra browser origins allowed to open the live video socket.
      NVR_LOCAL_NETWORKS: ${NVR_LOCAL_NETWORKS:-}
      # A VPN or a link between sites that uses private addresses: list its range here so the people on it count as remote (#458).
      NVR_REMOTE_NETWORKS: ${NVR_REMOTE_NETWORKS:-}
      NVR_TUNNEL_NETWORKS: ${NVR_TUNNEL_NETWORKS:-}
      NVR_ALLOWED_ORIGINS: ${NVR_ALLOWED_ORIGINS:-}
      NVR_OIDC_TENANT_ID: ${NVR_OIDC_TENANT_ID:-}
      NVR_OIDC_CLIENT_ID: ${NVR_OIDC_CLIENT_ID:-}
      NVR_OIDC_CLIENT_SECRET: ${NVR_OIDC_CLIENT_SECRET:-}
      NVR_OIDC_SESSION_SECRET: ${NVR_OIDC_SESSION_SECRET:-}
      NVR_OIDC_ADMIN_ROLES: ${NVR_OIDC_ADMIN_ROLES:-}
      NVR_OIDC_OPERATOR_ROLES: ${NVR_OIDC_OPERATOR_ROLES:-}
      NVR_DISCOVERY_INTERFACE: ${NVR_DISCOVERY_INTERFACE:-}
      # Encrypted configuration backups (database and credential key, never footage).
      # Backups stay disabled until a passphrase of at least 16 characters is set.
      NVR_BACKUP_PASSPHRASE: ${NVR_BACKUP_PASSPHRASE:-}
      NVR_BACKUP_PASSPHRASE_FILE: ${NVR_BACKUP_PASSPHRASE_FILE:-}
      NVR_BACKUP_PATH: /backups
      NVR_BACKUP_KEEP: ${NVR_BACKUP_KEEP:-14}
      # Which disk holds each storage volume, for SMART (JSON, volume name to device). Needed in a container, where the disk cannot be traced from the mount.
      NVR_SMART_DEVICES: ${NVR_SMART_DEVICES:-}
      # Everything below is passed through only when it is set, in .env or in the shell that runs Compose (#544): a name with no value
      # here means "take it from there, and leave it unset in the container if it is not there". Compose reads .env only to fill in this
      # file, so a setting that is not named in this list never reaches the NVR. The README's table says what each one does.
      NVR_LISTEN_HOST:
      NVR_WEBAUTHN_RP_ID:
      NVR_TRUST_FORWARDED_FOR:
      NVR_VAPID_SUBJECT:
      NVR_PUSH_EXTRA_HOSTS:
      NVR_MAX_REQUEST_BYTES:
      NVR_UPDATE_CHECK:
      NVR_UPDATE_FEED_URL:
      NVR_UPDATE_IMAGE:
      NVR_LOG_FORWARD_URL:
      NVR_LOG_FORWARD_CA:
      NVR_LOG_FORWARD_LEVEL:
      NVR_LOG_FORWARD_QUEUE:
      NVR_LOG_FORWARD_HEADERS:
      NVR_MS_LOGIN_URL:
      NVR_MS_GRAPH_URL:
      NVR_HWACCEL:
      NVR_VAAPI_DEVICE:
      NVR_SEGMENT_SECONDS:
      NVR_MOTION_BUFFER_PATH:
      NVR_STORAGE_PRESSURE_FREE_BYTES:
      NVR_TIER_CACHE_PATH:
      NVR_TIER_CACHE_BYTES:
      NVR_FOOTAGE_CHAIN_KEEP_DAYS:
      NVR_LIVE_CONVERSIONS:
      NVR_EXPORT_QUEUE_PLACES:
      NVR_EXPORTS_PER_PERSON:
      NVR_EXPORTS_PER_ADMINISTRATOR:
      NVR_EXPORT_JOB_HOURS:
      NVR_REDACTION_REVIEW_PLACES:
      NVR_REDACTION_REVIEWS_PER_PERSON:
      NVR_REDACTION_REVIEW_HOURS:
      NVR_DB_LOG_LIMIT_MB:
      NVR_DB_SYNCHRONOUS:
      NVR_HEAVY_REQUESTS:
      NVR_HEAVY_REQUEST_SECONDS:
      NVR_STOP_GRACE_SECONDS:
      NVR_WEB_MAX_CONNECTIONS:
      NVR_WEB_FIRST_REQUEST_SECONDS:
      NVR_WORKER_START_SECONDS:
      NVR_ONVIF_TIMEOUT_SECONDS:
      NVR_TAMPER_SAMPLE_SECONDS:
      NVR_HARDENING_PROBE_GAP_SECONDS:
      NVR_SMART_INTERVAL_SECONDS:
      NVR_SMARTCTL:
      NVR_SIMILAR_EXTENSION:
      NVR_AI_CPU_THREADS:
      NVR_AI_MODEL_PATH:
      NVR_AI_MODEL_DIRECTORY:
      NVR_AI_ATTRIBUTE_MODEL_PATH:
      NVR_AI_REID_MODEL_PATH:
      NVR_AI_CLIP_MODEL_DIR:
      NVR_AI_REDACTION_MODEL_DIR:
      NVR_AI_PLATE_LABEL:
      NVR_PLATE_MODELS_DIR:
      NVR_PLATE_DETECTOR_MODEL_PATH:
      NVR_PLATE_RECOGNISER_MODEL_PATH:
      NVR_POSE_MODELS_DIR:
      NVR_FACE_MODELS_DIR:
    # Disk health (SMART) needs the recording disks passed through. Uncomment and name your disks, and tell the NVR which disk holds each volume;
    # without this, Settings > Recording & storage reports disk health as "not available". See docs/disk-health-and-retention-forecast.md.
    # For hardware video acceleration (docs/hevc-and-acceleration.md), pass the graphics device in, e.g. under devices: "/dev/dri:/dev/dri"
    # devices:
    #   - /dev/sda:/dev/sda
    # cap_add:
    #   - SYS_RAWIO
    # group_add:
    #   - "6"  # the host's disk group id (getent group disk): the NVR does not run as root, and block devices are group-readable
    volumes:
      - nvr-data:/data
      - nvr-secrets:/secrets
      - nvr-recordings:/recordings
      - nvr-archive:/recordings/archive
      # Point this at storage on a different disk or host, for example
      # "- /mnt/offsite/nvr-backups:/backups", so a host or disk loss does not take the backups too.
      # A folder mounted from the host keeps the host's owner, and the NVR runs as user 10001 with no privileges: give it the folder first
      # with "sudo chown -R 10001:10001 /mnt/offsite/nvr-backups" (the same for a recordings disk mounted this way). The NVR says so in its
      # log and raises an incident at start-up if it cannot write to a folder it was given.
      - nvr-backups:/backups
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]  # Asks /healthz at the address the interface is served on (NVR_LISTEN_HOST)
      interval: 30s
      timeout: 5s
      retries: 3
      # Covers an upgrade, which copies (and backs up) the database before it answers; the same as the Dockerfile's (#418).
      start_period: 300s

volumes:
  nvr-data:
  nvr-secrets:
  nvr-recordings:
  nvr-archive:
  nvr-backups:
