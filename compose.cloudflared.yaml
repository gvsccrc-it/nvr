# Reach the NVR through a Cloudflare Tunnel, with HTTPS, and without opening any port (docs/remote-access.md, "Cloudflare Tunnel").
#
#   CLOUDFLARE_TUNNEL_TOKEN=... NVR_PUBLIC_HOST=nvr.example.com docker compose -f compose.yaml -f compose.cloudflared.yaml up -d
#
# In the Cloudflare dashboard, give the tunnel a public hostname that points at http://127.0.0.1:8280 (the NVR's port), and put a Cloudflare Access
# policy in front of it. cloudflared runs on the host network, so the proxy the NVR sees is 127.0.0.1: the only address it believes forwarded headers from.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d  # Pinned (#384); Dependabot proposes updates
    network_mode: host
    restart: unless-stopped
    # Bounded on purpose (#543): Docker's default keeps every line for ever, on the system disk. 30 MB at most; raise max-size or
    # max-file here if you need more history. docs: README, "Container logs".
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN to the tunnel's token}
  nvr:
    environment:
      # The interface is reached through the tunnel and nowhere else (#541): it is served to this machine only, so the plain-HTTP port is
      # not also open on the local and camera networks beside the tunnel.
      NVR_LISTEN_HOST: ${NVR_LISTEN_HOST:-127.0.0.1}  # Set it in .env only if something on the local network must still reach the NVR directly
      NVR_TRUSTED_PROXIES: 127.0.0.1
      NVR_PUBLIC_URL: https://${NVR_PUBLIC_HOST:?Set NVR_PUBLIC_HOST to the tunnel's public hostname}
      NVR_COOKIE_SECURE: "true"
