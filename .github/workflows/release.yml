name: NVR release

# Push a tag like v1.2.0 on a commit of main that passed the checks. This publishes the image as ghcr.io/gvsccrc-it/nvr:1.2.0 and creates the release the NVR's
# Settings, Updates page reads: its notes, and a line saying which database schema the release needs so the page can say whether it migrates.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a commit of main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Require the tag to match the application version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(python3 -c 'import re,pathlib; print(re.search(r"APP_VERSION = \"([^\"]+)\"", pathlib.Path("app/version.py").read_text()).group(1))')"
          test "$expected" = "$actual" || { echo "Tag $GITHUB_REF_NAME does not match APP_VERSION $actual in app/version.py"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Publish the tested image under the version
        id: image
        # The release is the image CI built, tested and signed for this commit of main (published there as sha-<commit>), given the version
        # tag: never a new build (#385). The tag is resolved to its digest once, the signature CI made is checked on that digest, and the
        # version tag is given to the digest, not to a tag that could have moved meanwhile (#548).
        run: |
          short="$(echo "$GITHUB_SHA" | cut -c1-7)"
          version="${GITHUB_REF_NAME#v}"
          if ! manifest="$(docker buildx imagetools inspect "ghcr.io/gvsccrc-it/nvr:sha-$short" --format '{{json .Manifest}}')"; then
            echo "No tested image ghcr.io/gvsccrc-it/nvr:sha-$short yet: wait for CI on main to finish for this commit, then re-run this workflow."
            exit 1
          fi
          digest="$(echo "$manifest" | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          cosign verify "ghcr.io/gvsccrc-it/nvr@$digest" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          docker buildx imagetools create --tag "ghcr.io/gvsccrc-it/nvr:$version" "ghcr.io/gvsccrc-it/nvr@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          schema="$(PYTHONPATH=. python3 -c 'from app.migrations import latest_version; print(latest_version())')"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body > notes.md
          # The digest goes in the line the NVR reads, so the upgrade steps it shows name the image by it (#548)
          printf '\n<!-- nvr-release: {"schema_version": %s, "digest": "%s"} -->\n' "$schema" "$DIGEST" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
