name: NVR checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A weekly rebuild of main (#548): when no commit lands, the image still picks up Debian's security fixes. It goes through every check
  # below, the image scan included, and publishes edge only; a release is still a deliberate tag (#540).
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

# A newer push to a pull request makes the older run pointless: stop it, so its runner-minutes are not spent on a commit nobody will merge.
# Every other run (a merge to main, a run started by hand) is a group of its own, so none waits for or cancels another and every merge is
# checked and published. A shared group was not enough: GitHub keeps only one waiting run per group, so a third merge inside one run's
# time cancelled the second, which was then never tested or published as sha-<commit> (#549). Runs on main can therefore overlap; the
# publish job moves edge only for the commit that is still main's newest.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that changes only documentation does not need the browser journeys (25 minutes). The unit tests still run: some of them read the docs.
  # A skipped job counts as passed for required checks. Anything else, and every run that is not a pull request, runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/changed-code.sh

  camera-browser-acceptance:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install FFmpeg
        # Packages are fetched in parallel and from a second mirror on retries (see the script): the Ubuntu mirror has been slow enough to time out a serial install.
        timeout-minutes: 15
        run: bash .github/scripts/install-ffmpeg.sh
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check app tools scripts tests
      - name: Install pinned Playwright and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build the browser interface
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
      - name: Start the simulated camera's RTSP server
        # .github/camera-simulator/compose.yaml: pinned by digest, and updated by Dependabot (#549)
        run: docker compose -f .github/camera-simulator/compose.yaml up -d --wait
      - name: Start simulated RTSP camera
        run: |
          nohup ffmpeg -re -f lavfi -i testsrc=size=320x240:rate=10 -t 2100 -an \
            -c:v libx264 -pix_fmt yuv420p -preset ultrafast -tune zerolatency -g 10 \
            -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/nvr-test \
            >/tmp/nvr-browser-rtsp-publisher.log 2>&1 &
          nohup ffmpeg -re -f lavfi -i testsrc=size=320x240:rate=10 -f lavfi -i sine=frequency=440:sample_rate=16000 -t 2100 \
            -c:v libx264 -pix_fmt yuv420p -preset ultrafast -tune zerolatency -g 10 -c:a aac -b:a 32k \
            -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/nvr-audio \
            >/tmp/nvr-browser-rtsp-publisher-audio.log 2>&1 &
          for attempt in $(seq 1 30); do
            if ffprobe -v error -rtsp_transport tcp -show_entries stream=codec_type \
              -of csv=p=0 rtsp://127.0.0.1:8554/nvr-test | grep -q video; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nvr-browser-rtsp-publisher.log
          exit 1
      - name: Run authenticated camera administration browser journeys
        run: npm run test:browser
        env:
          NVR_BROWSER_REPORT_PRIVACY_SENTINEL: nvr-camera-browser-report-privacy-sentinel-v1
      - name: Validate browser report privacy
        id: report-privacy
        if: always()
        env:
          NVR_BROWSER_REPORT_PRIVACY_SENTINEL: nvr-camera-browser-report-privacy-sentinel-v1
        run: node tests/browser/validate_acceptance_report_privacy.cjs
      - name: Retain browser acceptance evidence and failure media
        if: always() && steps.report-privacy.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: camera-admin-browser-acceptance
          path: test-results/
          if-no-files-found: warn

  # The unit tests, split over four runners so they take about a quarter of the time. Each shard has a machine to itself, so the
  # timing-sensitive tests run as they would in one long run; tests/shard.py balances the modules by how long each took (module_seconds.json).
  unit-tests:
    name: unit-tests (${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install FFmpeg
        # Packages are fetched in parallel and from a second mirror on retries (see the script): the Ubuntu mirror has been slow enough to time out a serial install.
        timeout-minutes: 15
        run: bash .github/scripts/install-ffmpeg.sh
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Start the simulated camera's RTSP server
        # .github/camera-simulator/compose.yaml: pinned by digest, and updated by Dependabot (#549)
        run: docker compose -f .github/camera-simulator/compose.yaml up -d --wait
      - name: Start simulated RTSP camera
        # The camera must outlive the shard's tests (about 10 minutes; the job stops at 30). It ends with the job.
        run: |
          nohup ffmpeg -re -f lavfi -i testsrc=size=320x240:rate=10 -t 3900 -an \
            -c:v libx264 -pix_fmt yuv420p -preset ultrafast -tune zerolatency -g 10 \
            -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/nvr-test \
            >/tmp/nvr-rtsp-publisher.log 2>&1 &
          nohup ffmpeg -re -f lavfi -i testsrc=size=320x240:rate=10 -f lavfi -i sine=frequency=440:sample_rate=16000 -t 3900 \
            -c:v libx264 -pix_fmt yuv420p -preset ultrafast -tune zerolatency -g 10 -c:a aac -b:a 32k \
            -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/nvr-audio \
            >/tmp/nvr-rtsp-publisher-audio.log 2>&1 &
          for attempt in $(seq 1 30); do
            if ffprobe -v error -rtsp_transport tcp -show_entries stream=codec_type \
              -of csv=p=0 rtsp://127.0.0.1:8554/nvr-test | grep -q video; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nvr-rtsp-publisher.log
          exit 1
      - name: Start the S3-compatible store for the cold storage tier tests
        # moto's server with request signing checked, from the hash-locked requirements-ci-s3.txt (#402). Not best effort: if it does not
        # start, the job fails rather than skipping the tests that need a real store. (It replaced MinIO, whose image left Docker Hub.)
        run: bash .github/scripts/start-s3-store.sh
      - name: Run API and media tests
        env:
          NVR_RTSP_TEST_URL: rtsp://127.0.0.1:8554/nvr-test
          NVR_RTSP_AUDIO_TEST_URL: rtsp://127.0.0.1:8554/nvr-audio
          NVR_REQUIRE_PLATE_MODELS: "1"  # The real plate models are downloaded and tested here, never silently skipped
          NVR_REQUIRE_POSE_MODELS: "1"  # The real pose model for fall detection is downloaded and tested here, never silently skipped
        # A quarter of the test modules, chosen by tests/shard.py so the four shards take about as long (see that file).
        run: python -m tests.shard --shard ${{ matrix.shard }} --of 4 --run

  # Everything else verify used to do after the unit tests: compile, web build, unused-code check, Compose and image checks, the smoke test.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install FFmpeg
        # Packages are fetched in parallel and from a second mirror on retries (see the script): the Ubuntu mirror has been slow enough to time out a serial install.
        timeout-minutes: 15
        run: bash .github/scripts/install-ffmpeg.sh
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check for known vulnerabilities
        # The locked Python packages and the web interface's packages (#385). Fails on a finding not accepted, with a reason,
        # in .github/vulnerability-exceptions.txt. pip-audit runs from its own hash-locked environment.
        run: |
          python -m venv /tmp/nvr-audit
          /tmp/nvr-audit/bin/python -m pip install --quiet --require-hashes -r requirements-ci-audit.txt
          python .github/scripts/check-vulnerabilities.py /tmp/nvr-audit/bin/pip-audit
      - name: Every test module is in exactly one shard
        run: python -m tests.shard --check 4
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Typecheck and build the browser interface
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
      - name: Check for unused frontend code
        run: npm run unused --prefix web
      - name: Test browser harness configuration
        run: node --test tests-js/*.test.cjs
      - name: Validate Compose configuration
        run: |
          docker compose config -q
          docker compose -f compose.yaml -f compose.discovery.yaml config -q
          TS_AUTHKEY=x TS_TAILNET=example docker compose -f compose.yaml -f compose.tailscale.yaml config -q
          CLOUDFLARE_TUNNEL_TOKEN=x NVR_PUBLIC_HOST=nvr.example.com docker compose -f compose.yaml -f compose.cloudflared.yaml config -q
          docker compose -f compose.yaml -f compose.wireguard.yaml config -q
      - name: Build container image
        # This image is the one published from main (#385): the publish job loads it rather than building again.
        run: |
          docker build --tag ghcr.io/gvsccrc-it/nvr:edge \
            --build-arg NVR_BUILD_COMMIT="${{ github.sha }}" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" .
      - name: Install Trivy
        # The scanner for the image's system packages (#548): a release binary checked against the SHA-256 its project publishes
        # (trivy_0.76.2_checksums.txt), as the models are. Dependabot does not update this: raise the version and the hash together.
        run: |
          curl -fsSL --retry 3 -o /tmp/trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          echo 'bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  /tmp/trivy.tgz' | sha256sum -c -
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
      - name: Scan the image's system packages
        # Fails on a High or Critical finding with a fix available that .github/vulnerability-exceptions.txt does not accept (with a reason
        # and an expiry date); findings with no fix yet are listed, not failed (the owner's decision on #548). FFmpeg parses what cameras send.
        run: |
          /tmp/trivy image --scanners vuln --pkg-types os --severity HIGH,CRITICAL --format json --output /tmp/nvr-image-scan.json --quiet ghcr.io/gvsccrc-it/nvr:edge
          python .github/scripts/check-vulnerabilities.py --image /tmp/nvr-image-scan.json
      - name: Benchmark and validate bundled CPU detection model
        run: docker run --rm ghcr.io/gvsccrc-it/nvr:edge python -m scripts.benchmark_ai
      - name: Check the licence plate models in the image
        run: docker run --rm ghcr.io/gvsccrc-it/nvr:edge python -m scripts.check_plate_models
      - name: Smoke test Compose health and persistence
        run: |
          # compose.yaml names a released version; the image under test is the one just built, given that name for this machine only.
          docker tag ghcr.io/gvsccrc-it/nvr:edge "$(docker compose config --images | head -n 1)"
          NVR_PORT=8080 docker compose up --pull never -d
          NVR_CI_TEST_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export NVR_CI_TEST_PASSWORD
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = "http://127.0.0.1:8080"

          def get_json(path):
              with urllib.request.urlopen(base + path, timeout=3) as response:
                  return response.status, json.load(response)

          for _ in range(40):
              try:
                  get_json("/healthz")
                  break
              except Exception:
                  time.sleep(1)
          else:
              import subprocess
              subprocess.run(["docker", "compose", "ps", "-a"], check=False)
              subprocess.run(["docker", "compose", "logs", "--no-color", "nvr"], check=False)
              raise RuntimeError("Compose service did not become healthy")

          status, setup = get_json("/api/setup/status")
          assert status == 200 and setup["setup_required"]
          # First-time setup needs the one-time code the NVR printed when it started with no administrator (#542). An installer reads it
          # from the log; here it is read from the file the NVR keeps it in, and checked to be in the log too.
          import subprocess
          import urllib.error
          code = subprocess.run(["docker", "compose", "exec", "-T", "nvr", "cat", "/secrets/setup-code"], check=True, capture_output=True, text=True).stdout.strip()
          logs = subprocess.run(["docker", "compose", "logs", "--no-color", "nvr"], check=True, capture_output=True, text=True)
          assert code and code in logs.stdout + logs.stderr, "the setup code was not printed in the container's log"
          refused = urllib.request.Request(base + "/api/setup/admin", method="POST", headers={"Content-Type": "application/json"},
                                           data=json.dumps({"username": "ci-admin", "password": os.environ["NVR_CI_TEST_PASSWORD"]}).encode())
          try:
              urllib.request.urlopen(refused, timeout=5)
              raise AssertionError("setup without the code was accepted")
          except urllib.error.HTTPError as error:
              assert error.code == 403, error.code
          payload = json.dumps({"username": "ci-admin", "password": os.environ["NVR_CI_TEST_PASSWORD"], "setup_code": code}).encode()
          request = urllib.request.Request(
              base + "/api/setup/admin", data=payload,
              headers={"Content-Type": "application/json"}, method="POST"
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              assert response.status == 201
          PY
          # Every mounted volume can be written by the user the NVR runs as, the archive volume inside the recordings volume included (#551).
          docker compose exec -T nvr sh -c 'for folder in /data /secrets /recordings /recordings/archive /backups; do touch "$folder/.ci-write-check" && rm "$folder/.ci-write-check" || exit 1; done; id -u'
          docker compose restart nvr
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "http://127.0.0.1:8080"
          for _ in range(40):
              try:
                  with urllib.request.urlopen(base + "/healthz", timeout=3):
                      pass
                  with urllib.request.urlopen(base + "/api/setup/status", timeout=3) as response:
                      setup = json.load(response)
                  assert not setup["setup_required"], "Administrator state was lost on restart"
                  break
              except Exception:
                  time.sleep(1)
          else:
              import subprocess
              subprocess.run(["docker", "compose", "ps", "-a"], check=False)
              subprocess.run(["docker", "compose", "logs", "--no-color", "nvr"], check=False)
              raise RuntimeError("Compose service did not recover with persisted state")
          PY
      - name: Tear down Compose stack
        if: always()
        run: docker compose down -v
      - name: Keep the tested image for publishing
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        run: |
          docker save ghcr.io/gvsccrc-it/nvr:edge | zstd -T0 -3 -o /tmp/nvr-image.tar.zst
          # The list of what is in the image (CycloneDX), published with it as an attestation (#548)
          /tmp/trivy image --format cyclonedx --output /tmp/nvr-sbom.cdx.json --quiet ghcr.io/gvsccrc-it/nvr:edge
      - name: Hand the tested image to the publish job
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image
          path: |
            /tmp/nvr-image.tar.zst
            /tmp/nvr-sbom.cdx.json
          retention-days: 1
          compression-level: 0


  # The one check to require before merging: it passes only when every unit-test shard and the build passed. It runs even when one of them
  # failed or was skipped (a skipped job would otherwise count as passed for a required check).
  verify:
    needs: [unit-tests, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every unit-test shard and the build passed
        env:
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "unit tests: $UNIT_TESTS, build: $BUILD"
          test "$UNIT_TESTS" = success && test "$BUILD" = success
  # Published only when the browser journeys passed as well as the unit tests and the build (#540): edge and sha-<commit> are what test
  # machines run and what a release is made from. On a push to main the browser job always runs (see "changes").
  # Signed keylessly with this workflow's own identity (cosign; no key to keep), with a record of how it was built (provenance) and of
  # what is in it (SBOM), all attached to the image's digest (#548). Verify with the command in docs/guided-updates.md.
  publish:
    needs: [verify, camera-browser-acceptance]
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # The workflow's identity, for keyless signing and the attestations
      attestations: write
    steps:
      # The image published is the one the verify job built and tested, not a second build of the same commit (#385).
      - name: Fetch the tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image
          path: /tmp
      - name: Load the tested image
        run: zstd -dc /tmp/nvr-image.tar.zst | docker load

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        id: publish
        # edge, and sha-<commit> so a release can name exactly this image (release.yml retags it by digest rather than building again).
        # Runs on main can overlap (see "concurrency"): sha-<commit> is always published, and edge only while this commit is still main's
        # newest, so a run that finishes after a later merge's never moves edge back to an older build. The weekly rebuild publishes edge
        # only: sha-<commit> stays the image tested when the commit was merged, which is what a release is made from.
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          short="$(echo "$GITHUB_SHA" | cut -c1-7)"
          pushed=""
          if [ "$EVENT" != schedule ]; then
            docker tag ghcr.io/gvsccrc-it/nvr:edge "ghcr.io/gvsccrc-it/nvr:sha-$short"
            docker push "ghcr.io/gvsccrc-it/nvr:sha-$short"
            pushed="sha-$short"
          fi
          newest="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$newest" = "$GITHUB_SHA" ]; then
            docker push ghcr.io/gvsccrc-it/nvr:edge
            pushed="${pushed:-edge}"
          else
            echo "main has moved on to $newest: edge is left to that commit's run"
          fi
          # The digest of what was pushed, read back from the registry: that is what is signed and attested. Nothing pushed, nothing signed.
          if [ -n "$pushed" ]; then
            digest="$(docker buildx imagetools inspect "ghcr.io/gvsccrc-it/nvr:$pushed" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Published ghcr.io/gvsccrc-it/nvr@$digest"
          fi
      - name: Install cosign
        if: steps.publish.outputs.digest != ''
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image
        if: steps.publish.outputs.digest != ''
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "ghcr.io/gvsccrc-it/nvr@$DIGEST"
      - name: Record how the image was built
        if: steps.publish.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/gvsccrc-it/nvr
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Record what is in the image
        if: steps.publish.outputs.digest != ''
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/gvsccrc-it/nvr
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: /tmp/nvr-sbom.cdx.json
          push-to-registry: true
